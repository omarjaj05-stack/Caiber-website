<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Caiber Admin</title>
    <link rel="stylesheet" href="/static/caiber.css">
    <script defer src="/static/caiber-icons.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #0a0e27 0%, #0f1535 50%, #0a0e27 100%);
            color: #e8e8e8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6; min-height: 100vh;
        }
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.4rem 5%; border-bottom: 1px solid rgba(0,200,200,0.2);
            background: rgba(10,14,39,0.95); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
        }
        .logo {
            font-size: 1.5rem; font-weight: 900; letter-spacing: 2.5px;
            background: linear-gradient(135deg, #00e8e8 0%, #00c8c8 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .nav-actions { display: flex; gap: 1rem; align-items: center; }
        .nav-link { color: #a8a8a8; text-decoration: none; font-weight: 600; font-size: 0.9rem;
                    display: inline-flex; align-items: center; gap: 0.4rem; }
        .nav-link:hover { color: #00e8e8; }

        .wrap { max-width: 900px; margin: 0 auto; padding: 3rem 5%; }
        .head-row { display: flex; justify-content: space-between; align-items: center;
                    margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        .head-row h1 { font-size: 2rem; color: #ffffff; }
        .new-btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.9rem 1.8rem;
            background: linear-gradient(135deg, #00c8c8 0%, #00e8e8 100%);
            color: #0a0e27; text-decoration: none; border-radius: 10px;
            font-weight: 800; transition: all 0.3s ease;
        }
        .new-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,200,200,0.4); }

        .post-row {
            display: flex; justify-content: space-between; align-items: center; gap: 1rem;
            background: rgba(0,200,200,0.04); border: 1px solid rgba(0,200,200,0.2);
            border-radius: 12px; padding: 1.2rem 1.5rem; margin-bottom: 1rem; flex-wrap: wrap;
        }
        .post-row .info h3 { color: #ffffff; font-size: 1.1rem; margin-bottom: 0.2rem; }
        .post-row .info .meta { color: #7a869c; font-size: 0.82rem; }
        .row-actions { display: flex; gap: 0.6rem; align-items: center; }
        .row-actions a, .row-actions button {
            padding: 0.55rem 1rem; border-radius: 8px; font-weight: 700; font-size: 0.85rem;
            text-decoration: none; cursor: pointer; border: 1.5px solid; background: transparent;
            display: inline-flex; align-items: center; gap: 0.35rem; transition: all 0.25s ease;
        }
        .edit-a { color: #00e8e8; border-color: rgba(0,200,200,0.4); }
        .edit-a:hover { background: rgba(0,200,200,0.12); }
        .view-a { color: #a8a8a8; border-color: rgba(168,168,168,0.3); }
        .view-a:hover { background: rgba(168,168,168,0.1); color: #fff; }
        .del-b { color: #ff6b6b; border-color: rgba(255,107,107,0.4); font-family: inherit; }
        .del-b:hover { background: rgba(255,107,107,0.12); }

        .empty { text-align: center; color: #7a869c; padding: 4rem 1rem; font-size: 1.05rem; }

        html, body { max-width: 100%; overflow-x: hidden; }
        @media (max-width: 600px) {
            nav { padding: 1rem 4%; }
            .wrap { padding: 2rem 4%; }
            .head-row h1 { font-size: 1.5rem; }
            .head-row { flex-direction: column; align-items: stretch; }
            .new-btn { justify-content: center; }
            .post-row { flex-direction: column; align-items: stretch; gap: 0.8rem; }
            .row-actions { justify-content: flex-start; flex-wrap: wrap; }
            .row-actions form { display: inline; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">CAIBER</div>
        <div class="nav-actions">
            <a href="/blog" class="nav-link" target="_blank">View Blog</a>
            <a href="/admin/logout" class="nav-link">Log out</a>
        </div>
    </nav>

    <div class="wrap">
        <div class="head-row">
            <h1>Blog Posts</h1>
            <a href="/admin/new" class="new-btn"><span class="icon icon-inline" data-icon="check"></span> New Post</a>
        </div>

        {% if posts and posts|length > 0 %}
            {% for post in posts %}
                <div class="post-row">
                    <div class="info">
                        <h3>{{ post.title }}</h3>
                        <div class="meta">{{ post.date }} &middot; {{ post.author }}</div>
                    </div>
                    <div class="row-actions">
                        <a class="view-a" href="/blog/{{ post.id }}" target="_blank">View</a>
                        <a class="edit-a" href="/admin/edit/{{ post.id }}">Edit</a>
                        <form method="POST" action="/admin/delete/{{ post.id }}" style="display:inline"
                              onsubmit="return confirm('Delete this post permanently?');">
                            <button class="del-b" type="submit">Delete</button>
                        </form>
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <div class="empty">No posts yet. Click "New Post" to write your first one.</div>
        {% endif %}
    </div>
</body>
</html>
