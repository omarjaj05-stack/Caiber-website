<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Edit' if post else 'New' }} Post | Caiber Admin</title>
    <link rel="stylesheet" href="/static/caiber.css">
    <script defer src="/static/caiber-icons.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:wght@400;700&family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@400;700&family=Roboto+Mono:wght@400;600&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #0a0e27 0%, #0f1535 50%, #0a0e27 100%);
            color: #e8e8e8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6; min-height: 100vh;
        }
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.4rem 5%; border-bottom: 1px solid rgba(0,200,200,0.2);
            background: rgba(10,14,39,0.95); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
        }
        .logo {
            font-size: 1.5rem; font-weight: 900; letter-spacing: 2.5px;
            background: linear-gradient(135deg, #00e8e8 0%, #00c8c8 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .nav-link { color: #a8a8a8; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        .nav-link:hover { color: #00e8e8; }

        .wrap { max-width: 850px; margin: 0 auto; padding: 2.5rem 5% 5rem; }
        h1 { font-size: 1.8rem; color: #ffffff; margin-bottom: 1.5rem; }
        label {
            display: block; color: #00e8e8; font-weight: 700; font-size: 0.85rem;
            margin: 1.5rem 0 0.5rem; letter-spacing: 0.5px; text-transform: uppercase;
        }
        input[type=text], input[type=url] {
            width: 100%; padding: 0.85rem 1rem;
            background: rgba(10,14,39,0.6); border: 1.5px solid rgba(0,200,200,0.3);
            border-radius: 10px; color: #e8e8e8; font-size: 1rem;
        }
        input:focus { outline: none; border-color: #00e8e8; }
        .hint { color: #7a869c; font-size: 0.8rem; margin-top: 0.3rem; }
        .error { color: #ff6b6b; margin-bottom: 1rem; }

        /* Toolbar - clean, minimal, with a collapsible "More" panel */
        .toolbar {
            background: rgba(10,14,39,0.8); border: 1.5px solid rgba(0,200,200,0.3);
            border-bottom: none; border-radius: 12px 12px 0 0; padding: 0.6rem 0.8rem;
        }
        .toolbar-main {
            display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center;
        }
        .toolbar select {
            background: rgba(10,14,39,0.5); border: 1px solid rgba(0,200,200,0.22);
            color: #d0d0d0; border-radius: 8px; padding: 0.5rem 0.6rem; cursor: pointer;
            font-size: 0.88rem; font-weight: 600; transition: all 0.18s ease;
        }
        .toolbar select:hover { border-color: #00e8e8; color: #00e8e8; }
        .toolbar select option { background: #10162e; color: #e8e8e8; }
        .toolbar button {
            background: transparent; border: none; color: #c0c8d8;
            border-radius: 7px; padding: 0.45rem 0.6rem; cursor: pointer;
            font-size: 0.95rem; font-weight: 700; min-width: 34px; height: 34px;
            transition: all 0.15s ease; line-height: 1;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .toolbar button:hover { background: rgba(0,200,200,0.15); color: #00e8e8; }
        .tbar-divider { width: 1px; height: 22px; background: rgba(0,200,200,0.18); margin: 0 0.25rem; }
        .more-btn {
            margin-left: auto; color: #00e8e8 !important; font-size: 0.82rem !important;
            font-weight: 700 !important; padding: 0.45rem 0.8rem !important;
            border: 1px solid rgba(0,200,200,0.3) !important; min-width: auto !important;
        }
        .more-btn:hover { background: rgba(0,200,200,0.12) !important; }

        /* Collapsible advanced panel */
        .toolbar-more {
            display: none; margin-top: 0.6rem; padding-top: 0.7rem;
            border-top: 1px solid rgba(0,200,200,0.15);
            flex-wrap: wrap; gap: 0.9rem; align-items: center;
        }
        .toolbar-more.open { display: flex; }
        .more-group { display: flex; align-items: center; gap: 0.3rem; }
        .more-group .glabel {
            color: #6a748c; font-size: 0.7rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.5px; margin-right: 0.15rem;
        }
        .toolbar input[type=color] {
            width: 30px; height: 30px; padding: 0; border: 1px solid rgba(0,200,200,0.25);
            border-radius: 7px; background: transparent; cursor: pointer;
        }

        .editor {
            min-height: 380px; padding: 1.3rem;
            background: rgba(10,14,39,0.6);
            border: 1.5px solid rgba(0,200,200,0.3); border-top: none;
            border-radius: 0 0 12px 12px; color: #e8e8e8; font-size: 1.05rem; line-height: 1.8;
            overflow-y: auto;
        }
        .editor:focus { outline: none; }
        .editor:empty:before { content: attr(data-placeholder); color: #6a748c; }
        .editor h1 { color: #00e8e8; font-size: 2rem; margin: 1rem 0 0.6rem; }
        .editor h2 { color: #00e8e8; font-size: 1.6rem; margin: 1rem 0 0.6rem; }
        .editor h3 { color: #00e8e8; font-size: 1.3rem; margin: 0.9rem 0 0.5rem; }
        .editor blockquote { border-left: 3px solid #00e8e8; padding-left: 1rem;
                             margin: 1rem 0; color: #a8a8a8; font-style: italic; }
        .editor img { max-width: 100%; border-radius: 8px; margin: 0.8rem 0; }
        .editor a { color: #00e8e8; }
        .editor ul, .editor ol { margin-left: 1.5rem; }
        .editor pre { background: rgba(0,0,0,0.5); border-radius: 8px; padding: 1rem;
                      font-family: 'Roboto Mono', monospace; overflow-x: auto; margin: 1rem 0; }

        .btn-row { display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }
        .save-btn {
            padding: 1rem 2.5rem; background: linear-gradient(135deg, #00c8c8 0%, #00e8e8 100%);
            color: #0a0e27; border: none; border-radius: 10px; font-weight: 800;
            font-size: 1rem; cursor: pointer; transition: all 0.3s ease;
        }
        .save-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,200,200,0.4); }
        .preview-btn {
            padding: 1rem 2rem; background: rgba(0,200,200,0.08);
            border: 1.5px solid rgba(0,200,200,0.4); color: #00e8e8;
            border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.3s ease;
        }
        .preview-btn:hover { background: rgba(0,200,200,0.16); }
        .cancel-a { padding: 1rem 2rem; color: #a8a8a8; text-decoration: none; font-weight: 600;
                    display: inline-flex; align-items: center; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
                 z-index: 500; overflow-y: auto; padding: 3rem 1rem; }
        .modal.show { display: block; }
        .modal-inner { max-width: 780px; margin: 0 auto; background: #0f1535;
                       border: 1.5px solid rgba(0,200,200,0.3); border-radius: 16px; padding: 2.5rem; }
        .modal-inner h2.pv-title { color: #fff; font-size: 2rem; margin-bottom: 1rem; }
        .pv-content { color: #d0d0d0; font-size: 1.1rem; line-height: 1.8; }
        .pv-content h1,.pv-content h2,.pv-content h3 { color: #00e8e8; margin: 1rem 0 0.5rem; }
        .pv-content img { max-width: 100%; border-radius: 10px; margin: 1rem 0; }
        .pv-content blockquote { border-left: 3px solid #00e8e8; padding-left: 1rem;
                                 color: #a8a8a8; font-style: italic; margin: 1rem 0; }
        .close-pv { float: right; background: none; border: none; color: #a8a8a8;
                    font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">CAIBER</div>
        <a href="/admin/dashboard" class="nav-link">Back to Dashboard</a>
    </nav>

    <div class="wrap">
        <h1>{{ 'Edit Post' if post else 'New Post' }}</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}

        <form method="POST" id="postForm">
            <label>Post Title</label>
            <input type="text" name="title" id="title" value="{{ post.title if post else '' }}"
                   placeholder="Your post title" required>

            <label>Author</label>
            <input type="text" name="author" value="{{ post.author if post else 'Caiber' }}"
                   placeholder="Author name">

            <label>Featured Image URL (optional)</label>
            <input type="url" name="image_url" value="{{ post.image_url if post else '' }}"
                   placeholder="https://example.com/image.jpg">
            <div class="hint">Paste a link to an image. (Direct upload coming later.)</div>

            <label>Article Content</label>
            <div class="toolbar">
                <!-- Main row: the essentials, always visible -->
                <div class="toolbar-main">
                    <select onchange="applyBlock(this.value); this.selectedIndex=0" title="Paragraph style">
                        <option value="">Normal text</option>
                        <option value="H1">Heading 1</option>
                        <option value="H2">Heading 2</option>
                        <option value="H3">Heading 3</option>
                        <option value="BLOCKQUOTE">Quote</option>
                        <option value="PRE">Code block</option>
                    </select>
                    <select onchange="fmt('fontName', this.value); this.selectedIndex=0" title="Font">
                        <option value="">Font</option>
                        <option value="Inter">Inter</option>
                        <option value="Montserrat">Montserrat</option>
                        <option value="Lora">Lora</option>
                        <option value="Merriweather">Merriweather</option>
                        <option value="Playfair Display">Playfair</option>
                        <option value="Roboto Slab">Roboto Slab</option>
                        <option value="Roboto Mono">Roboto Mono</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Arial">Arial</option>
                        <option value="Courier New">Courier</option>
                    </select>

                    <span class="tbar-divider"></span>
                    <button type="button" onclick="fmt('bold')" title="Bold"><b>B</b></button>
                    <button type="button" onclick="fmt('italic')" title="Italic"><i>I</i></button>
                    <button type="button" onclick="fmt('underline')" title="Underline"><u>U</u></button>

                    <span class="tbar-divider"></span>
                    <button type="button" onclick="fmt('insertUnorderedList')" title="Bullet list">&bull;</button>
                    <button type="button" onclick="fmt('insertOrderedList')" title="Numbered list">1.</button>
                    <button type="button" onclick="addLink()" title="Insert link">&#128279;</button>

                    <button type="button" class="more-btn" onclick="toggleMore()" id="moreBtn">More &#9662;</button>
                </div>

                <!-- Collapsible: everything else -->
                <div class="toolbar-more" id="toolbarMore">
                    <div class="more-group">
                        <span class="glabel">Size</span>
                        <select onchange="fmt('fontSize', this.value); this.selectedIndex=0" title="Text size">
                            <option value="">Normal</option>
                            <option value="2">Small</option>
                            <option value="4">Large</option>
                            <option value="5">X-Large</option>
                            <option value="6">Huge</option>
                            <option value="7">Giant</option>
                        </select>
                    </div>
                    <div class="more-group">
                        <span class="glabel">Text</span>
                        <input type="color" onchange="fmt('foreColor', this.value)" title="Text color" value="#00e8e8">
                        <span class="glabel">Mark</span>
                        <input type="color" onchange="fmt('hiliteColor', this.value)" title="Highlight color" value="#ffff00">
                    </div>
                    <div class="more-group">
                        <span class="glabel">Align</span>
                        <button type="button" onclick="fmt('justifyLeft')" title="Align left">&#8676;</button>
                        <button type="button" onclick="fmt('justifyCenter')" title="Center">&#8596;</button>
                        <button type="button" onclick="fmt('justifyRight')" title="Align right">&#8677;</button>
                        <button type="button" onclick="fmt('justifyFull')" title="Justify">&#8801;</button>
                    </div>
                    <div class="more-group">
                        <button type="button" onclick="fmt('strikeThrough')" title="Strikethrough"><s>S</s></button>
                        <button type="button" onclick="addImage()" title="Insert image">Image</button>
                        <button type="button" onclick="fmt('removeFormat')" title="Clear formatting">Clear</button>
                    </div>
                </div>
            </div>
            <div class="editor" id="editor" contenteditable="true"
                 data-placeholder="Write your article here...">{{ post.body | safe if post else '' }}</div>

            <input type="hidden" name="body" id="body">

            <div class="btn-row">
                <button type="submit" class="save-btn">Publish</button>
                <button type="button" class="preview-btn" onclick="openPreview()">Preview</button>
                <a href="/admin/dashboard" class="cancel-a">Cancel</a>
            </div>
        </form>
    </div>

    <div class="modal" id="previewModal">
        <div class="modal-inner">
            <button class="close-pv" onclick="closePreview()">&times;</button>
            <h2 class="pv-title" id="pvTitle"></h2>
            <div class="pv-content" id="pvContent"></div>
        </div>
    </div>

    <script>
        var editor = document.getElementById('editor');
        // Use CSS styling for color commands so they produce inline styles
        try { document.execCommand('styleWithCSS', false, true); } catch(e){}

        function fmt(cmd, val) {
            editor.focus();
            document.execCommand(cmd, false, val || null);
        }
        function applyBlock(tag) {
            if (!tag) return;
            editor.focus();
            document.execCommand('formatBlock', false, tag);
        }
        function addLink() {
            var url = prompt('Enter the link URL:');
            if (url) fmt('createLink', url);
        }
        function addImage() {
            var url = prompt('Enter the image URL:');
            if (url) fmt('insertImage', url);
        }
        function syncBody() { document.getElementById('body').value = editor.innerHTML; }
        document.getElementById('postForm').addEventListener('submit', syncBody);

        function openPreview() {
            document.getElementById('pvTitle').textContent = document.getElementById('title').value || '(untitled)';
            document.getElementById('pvContent').innerHTML = editor.innerHTML;
            document.getElementById('previewModal').classList.add('show');
        }
        function closePreview() { document.getElementById('previewModal').classList.remove('show'); }

        function toggleMore() {
            var panel = document.getElementById('toolbarMore');
            var btn = document.getElementById('moreBtn');
            var open = panel.classList.toggle('open');
            btn.innerHTML = open ? 'Less &#9652;' : 'More &#9662;';
        }
    </script>
</body>
</html>
